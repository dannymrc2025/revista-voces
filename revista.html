<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Voces del Corazón Maya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="visor">
  <header class="barra">
    <a href="index.html" class="volver">← Ediciones</a>
    <span id="titulo"></span>
  </header>

  <div class="barra-comentarios">
    <button id="btn-comentarios" class="btn" type="button" aria-expanded="false" aria-controls="panel-comentarios">💬 Comentarios (0)</button>
  </div>

  <main id="area" class="area">
    <div id="libro" class="libro" aria-live="polite"></div>
  </main>

  <div id="art-barra" class="art-barra" hidden>
    <p id="art-titulo" class="art-titulo"></p>
    <div class="art-botones">
      <button type="button" class="reac" data-campo="aplauso" data-emoji="👏" aria-pressed="false"><span class="e">👏</span><span class="n">0</span><span class="t">Me gustó</span></button>
      <button type="button" class="reac" data-campo="wow" data-emoji="🤯" aria-pressed="false"><span class="e">🤯</span><span class="n">0</span><span class="t">Sorprendente</span></button>
      <button type="button" class="reac" data-campo="corazon" data-emoji="❤️" aria-pressed="false"><span class="e">❤️</span><span class="n">0</span><span class="t">Me encantó</span></button>
      <button type="button" class="reac" data-campo="idea" data-emoji="💡" aria-pressed="false"><span class="e">💡</span><span class="n">0</span><span class="t">Aprendí algo</span></button>
    </div>
  </div>

  <nav class="controles" aria-label="Controles de la revista">
    <button id="prev" class="btn" aria-label="Página anterior">‹</button>
    <span id="contador" class="contador" aria-live="polite"></span>
    <button id="next" class="btn" aria-label="Página siguiente">›</button>
    <button id="leer" class="btn" aria-label="Leer página ampliada">🔍 Leer</button>
    <button id="compartir" class="btn">Compartir</button>
  </nav>
  <p class="aviso-visitas aviso-visor">Contamos visitas de forma anónima (sin datos personales).</p>
  <div id="ayuda-leer" class="ayuda-leer" role="status" hidden>Toca 🔍 o dos veces la página para leer más grande</div>

  <div id="lectura" class="lectura" role="dialog" aria-modal="true" aria-label="Modo lectura" hidden>
    <div class="lec-barra">
      <button id="lec-prev" class="btn" type="button" aria-label="Página anterior">‹</button>
      <span id="lec-pag" class="lec-pag" aria-live="polite"></span>
      <button id="lec-next" class="btn" type="button" aria-label="Página siguiente">›</button>
      <button id="lec-cerrar" class="btn" type="button">✕ Cerrar</button>
    </div>
    <div id="lec-vista" class="lec-vista">
      <div id="lec-lienzo" class="lec-lienzo"><img id="lec-img" alt="" draggable="false"></div>
    </div>
  </div>

  <section id="panel-comentarios" class="panel-comentarios" aria-hidden="true" aria-label="Comentarios">
    <div class="panel-cab">
      <h2 id="c-titulo">Comentarios (0)</h2>
      <button id="c-cerrar" class="btn" type="button">Cerrar</button>
    </div>
    <div class="panel-cuerpo">
      <div id="lista-comentarios"></div>
    </div>
    <div class="panel-pie">
      <p id="c-gracias" class="c-gracias" role="status" hidden></p>
      <button id="c-escribir" class="btn c-escribir" type="button" aria-expanded="false" aria-controls="c-form-wrap">✍️ Escribir un comentario</button>
      <div id="c-form-wrap" class="c-form-wrap">
        <form id="form-comentario" autocomplete="off">
          <div class="c-fila c-fila-1">
            <input id="c-nombre" type="text" placeholder="Tu nombre" aria-label="Nombre" minlength="2" maxlength="40" required>
            <label class="c-soy"><span>Soy:</span>
              <select id="c-rol" aria-label="Soy">
                <option>Alumno</option>
                <option>Docente</option>
                <option>Padre o madre de familia</option>
              </select>
            </label>
          </div>
          <select id="c-grupo" aria-label="Grupo">
            <option value="">Elige tu grupo</option>
            <optgroup label="1.er grado"><option>1A</option><option>1B</option><option>1C</option><option>1D</option><option>1E</option></optgroup>
            <optgroup label="2.º grado"><option>2A</option><option>2B</option><option>2C</option><option>2D</option><option>2E</option></optgroup>
            <optgroup label="3.er grado"><option>3A</option><option>3B</option><option>3C</option><option>3D</option><option>3E</option></optgroup>
          </select>
          <div class="c-texto-caja">
            <textarea id="c-texto" rows="3" placeholder="Escribe tu comentario" aria-label="Comentario" minlength="3" maxlength="500" required></textarea>
            <span id="c-contador" class="c-contador">0/500</span>
          </div>
          <div class="c-trampa" aria-hidden="true"><input id="c-web" type="text" name="web" tabindex="-1" autocomplete="off"></div>
          <div class="c-fila c-botones">
            <button id="c-enviar" class="btn primario" type="submit">Enviar</button>
            <button id="c-cancelar" class="btn" type="button">Cancelar</button>
          </div>
          <p id="msg-comentario" role="status"></p>
          <p class="c-aviso">Se revisa antes de publicarse. Usa solo tu nombre de pila.</p>
        </form>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <script src="js/revista.js"></script>
  <script type="module" src="js/comentarios.js"></script>
  <script type="module" src="js/visitas.js"></script>
  <script type="module" src="js/reacciones.js"></script>
</body>
</html>
