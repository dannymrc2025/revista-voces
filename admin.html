<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Administración – Voces del Corazón Maya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin">
  <a href="index.html" class="volver-sitio">← Volver al sitio</a>

  <section id="login" class="login" hidden>
    <form id="form-login" class="caja" autocomplete="on">
      <h1>Administración</h1>
      <input id="l-correo" type="email" placeholder="Correo" aria-label="Correo" autocomplete="username" required>
      <input id="l-clave" type="password" placeholder="Contraseña" aria-label="Contraseña" autocomplete="current-password" required>
      <button class="btn primario" type="submit">Entrar</button>
      <p id="l-msg" class="msg" role="alert"></p>
    </form>
  </section>

  <div id="panel" hidden>
    <header class="a-barra">
      <h1>Voces · Admin</h1>
      <button id="salir" class="btn" type="button">Cerrar sesión</button>
    </header>

    <nav class="tabs" role="tablist">
      <button class="tab activa" data-tab="comentarios" role="tab" type="button">Comentarios</button>
      <button class="tab" data-tab="ediciones" role="tab" type="button">Ediciones</button>
    </nav>

    <main class="a-main">
      <section id="tab-comentarios">
        <div class="fila-titulo">
          <h2>Pendientes <span id="n-pend" class="pill">0 pendientes</span></h2>
        </div>
        <div id="aprobar-todos-zona" class="zona-todos">
          <button id="aprobar-todos" class="btn primario" type="button" hidden>Aprobar todos los pendientes</button>
          <div id="aprobar-todos-conf" class="conf" hidden>
            <span id="aprobar-todos-txt"></span>
            <button id="todos-si" class="btn primario" type="button">Sí</button>
            <button id="todos-no" class="btn" type="button">No</button>
          </div>
        </div>
        <div id="lista-pend" class="lista"></div>

        <div class="fila-titulo">
          <h2>Publicados</h2>
          <select id="sel-ed" aria-label="Edición"></select>
        </div>
        <div id="lista-pub" class="lista"></div>
      </section>

      <section id="tab-ediciones" hidden>
        <div class="fila-titulo"><h2>Conexión con GitHub</h2></div>
        <div class="card sec">
          <form id="gh-form" class="campos" autocomplete="off">
            <input id="gh-token" type="password" placeholder="github_pat_…" aria-label="Token de GitHub" autocomplete="off" required>
            <button class="btn primario" type="submit">Guardar token</button>
          </form>
          <div id="gh-guardado" class="acciones" hidden>
            <span id="gh-estado" class="estado"></span>
            <button id="gh-probar" class="btn" type="button">Probar conexión</button>
            <button id="gh-reemplazar" class="btn" type="button">Reemplazar token</button>
          </div>
          <p id="gh-msg" class="nota" role="status"></p>
        </div>

        <div class="fila-titulo"><h2>Nueva edición</h2></div>
        <div class="card sec">
          <div id="ne-form" class="campos">
            <label id="ne-drop" class="drop">
              <input id="ne-file" type="file" accept="application/pdf,.pdf" hidden>
              <span id="ne-nombre-archivo">Arrastra el PDF aquí o toca para elegirlo</span>
            </label>
            <input id="ne-id" type="text" placeholder="ID: 2026-11 o 2026-12-especial" aria-label="ID de edición" autocapitalize="off" autocomplete="off">
            <input id="ne-titulo" type="text" placeholder="Título: Revista Escolar #2" aria-label="Título" autocomplete="off">
            <input id="ne-fecha" type="text" placeholder="Fecha: Noviembre 2026" aria-label="Fecha" autocomplete="off">
            <div id="ne-conf" class="conf" hidden>
              <span>Esta edición ya existe. ¿Reemplazarla?</span>
              <button id="ne-conf-si" class="btn peligro" type="button">Sí, reemplazar</button>
              <button id="ne-conf-no" class="btn" type="button">No</button>
            </div>
            <button id="ne-convertir" class="btn primario" type="button">Convertir PDF</button>
            <p id="ne-msg" class="nota" role="status"></p>
            <p id="ne-detalle" class="detalle"></p>
          </div>

          <div id="ne-prog" class="campos" hidden>
            <span id="ne-prog-txt"></span>
            <progress id="ne-prog-bar" value="0" max="1"></progress>
          </div>

          <div id="ne-prev" class="campos" hidden>
            <span id="ne-prev-info"></span>
            <div id="ne-miniaturas" class="miniaturas"></div>
            <div class="acciones">
              <button id="ne-publicar" class="btn primario" type="button">Publicar edición</button>
              <button id="ne-cancelar" class="btn" type="button">Cancelar</button>
            </div>
            <p id="ne-pub-msg" class="nota" role="status"></p>
          </div>

          <div id="ne-fin" class="campos" hidden>
            <strong>Publicada. Estará visible en 1 a 2 minutos</strong>
            <a id="ne-enlace" target="_blank" rel="noopener"></a>
            <div class="acciones">
              <button id="ne-copiar" class="btn primario" type="button">Copiar enlace para WhatsApp</button>
              <button id="ne-otra" class="btn" type="button">Subir otra edición</button>
            </div>
          </div>
        </div>

        <div class="fila-titulo"><h2>Ediciones publicadas</h2></div>
        <div id="lista-ed" class="lista-ed"></div>
      </section>
    </main>
  </div>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
